<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Mailworthy: a letter sealed with a gold coin ("worth mailing"). Source for
       media/logo-512.png, media/logo-400.png and Mailworthy/Textures/Icon.tga
       (tools/build-icons.sh). Kept simple so it reads at 64 px. -->
  <defs>
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f7dc8a"/>
      <stop offset="0.5" stop-color="#c9952c"/>
      <stop offset="1" stop-color="#7d5110"/>
    </linearGradient>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1f4f7d"/>
      <stop offset="1" stop-color="#0b1f38"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.42" r="0.62">
      <stop offset="0" stop-color="#4f97d6" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#4f97d6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fdf3d8"/>
      <stop offset="1" stop-color="#e0c487"/>
    </linearGradient>
    <linearGradient id="flap" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f4e2b2"/>
      <stop offset="1" stop-color="#d2b06a"/>
    </linearGradient>
    <radialGradient id="coin" cx="0.36" cy="0.3" r="0.78">
      <stop offset="0" stop-color="#fff5bf"/>
      <stop offset="0.45" stop-color="#f4c443"/>
      <stop offset="1" stop-color="#b0711b"/>
    </radialGradient>
  </defs>

  <!-- Tile: gold rim, deep blue, soft light behind the letter -->
  <rect x="8" y="8" width="496" height="496" rx="92" fill="url(#rim)"/>
  <rect x="28" y="28" width="456" height="456" rx="74" fill="url(#bg)"/>
  <rect x="28" y="28" width="456" height="456" rx="74" fill="url(#glow)"/>

  <!-- Letter -->
  <rect x="84" y="146" width="344" height="240" rx="24" fill="#05101e" opacity="0.35" transform="translate(8 12)"/>
  <rect x="84" y="146" width="344" height="240" rx="24" fill="url(#paper)" stroke="#6e4f22" stroke-width="10"/>
  <path d="M94 376 L256 262 L418 376" fill="none" stroke="#b08a4c" stroke-width="9" stroke-linejoin="round"/>
  <path d="M92 156 L256 292 L420 156 Z" fill="url(#flap)" stroke="#6e4f22" stroke-width="10" stroke-linejoin="round"/>

  <!-- Gold coin seal with a check mark -->
  <circle cx="264" cy="304" r="76" fill="#05101e" opacity="0.35"/>
  <circle cx="256" cy="294" r="76" fill="url(#coin)" stroke="#7d4f0e" stroke-width="9"/>
  <circle cx="256" cy="294" r="55" fill="none" stroke="#b47a1e" stroke-width="7" opacity="0.85"/>
  <path d="M222 296 L248 322 L292 268" fill="none" stroke="#6b4006" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Sparkle -->
  <path d="M384 92 l11 28 l28 11 l-28 11 l-11 28 l-11 -28 l-28 -11 l28 -11 z" fill="#fde68a"/>
  <path d="M118 96 l6 15 l15 6 l-15 6 l-6 15 l-6 -15 l-15 -6 l15 -6 z" fill="#fde68a" opacity="0.8"/>
</svg>
